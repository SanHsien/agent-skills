name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (ubuntu / py3.14)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PYTHONUTF8: "1"
      PYTHONIOENCODING: "utf-8"
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"

      - name: Install test dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Compile maintained Python
        run: >-
          python -m compileall -q tests
          tools/check_upstream_updates.py
          tools/check_dependency_freshness.py
          tools/check_links.py

      - name: Ruff (E9 + F)
        run: >-
          python -m ruff check --select E9,F --target-version py312
          tests
          tools/check_upstream_updates.py
          tools/check_dependency_freshness.py
          tools/check_links.py

      - name: Pytest
        run: python -m pytest tests -q

      - name: Validate skills
        run: node scripts/validate-skills.js

      - name: Validate commands
        run: node scripts/validate-commands.js

      - name: Check Markdown links
        run: python tools/check_links.py

  test-windows:
    name: test (windows / dev_check.ps1)
    runs-on: windows-latest
    timeout-minutes: 20
    env:
      PYTHONUTF8: "1"
      PYTHONIOENCODING: "utf-8"
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"

      - name: Install test dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Canonical Windows development gate
        shell: pwsh
        run: pwsh -NoProfile -File tools/dev_check.ps1
