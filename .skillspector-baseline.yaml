# SkillSpector baseline for this repository's own skills/ (release gate ratchet).
# Every entry below is an ALREADY-REVIEWED finding accepted at baseline creation time.
# New findings are NOT suppressed automatically -- they fail tools/dev_check.ps1 until
# someone reviews them and adds a fingerprint + reason here (or fixes the skill).
# Regenerate a skill's entries with: skillspector baseline skills/<name> --no-llm --reason '...'
#
# Exact fingerprints hash the scanner version together with the content and the finding, so a
# scanner upgrade invalidates all of them by design. Each entry records the `skill` it belongs
# to (the scanner ignores the field) because every skill is scanned as its own directory and
# `file` alone is always `SKILL.md`, which made an earlier regeneration ambiguous.
#
# `rules` (glob, id-only) for RP1 and PE3: `skillspector baseline` was verified to under-
# enumerate exact fingerprints when a single SKILL.md has several near-identical lines
# matching the same rule (e.g. a multi-line .env tree diagram, or several unrelated `npx
# ...@latest` examples) -- re-running `baseline` on the same unmodified file deterministically
# skips some occurrences every time (reproduced on ci-cd-and-automation/SKILL.md and
# security-and-hardening/SKILL.md; see the implementation report for this baseline's origin
# task). Since 2026-09-12 the two `rules` carry RP1/PE3 alone: a fresh scan showed every RP1
# and PE3 hit already suppressed by them, so the 16 per-occurrence fingerprints that shadowed
# the rules were dropped rather than rehashed. Scope/blast-radius note: because every skill
# is scanned as its own directory, a baseline `path` glob cannot distinguish "SKILL.md in
# skill X" from "SKILL.md in skill Y", so these rules apply repo-wide to rule RP1 (unpinned
# `npx ...@latest` install-command examples) and PE3 (.env/.env.local path mentions in
# secrets-management docs) for every skill, present and future, not just the two above. This
# is an intentional, reviewed tradeoff for this specific repo (an engineering-practices skill
# corpus where writing about CI tooling and secrets management is the core subject matter, so
# these two categories are structurally expected to keep recurring as false positives) -- not
# a blanket "ignore everything" suppression. Re-review periodically with `--show-suppressed`.
version: 2
scanner_version: 2.12.0
rules:
  - id: "RP1"
    reason: "自我指涉誤判類別：文件中『npx <pkg>@latest』等安裝／CI 指令範例是給使用者參考的文件文字，非本 skill 綁定執行的未鎖版號設定；規則層級豁免（見上方 rules 區塊說明的成因與範圍）。"
  - id: "PE3"
    reason: "自我指涉誤判類別：.env／.env.local 等憑證路徑字樣出現在祕密管理教學段落，說明檔案該不該提交，非本 skill 實際讀取或外洩憑證；規則層級豁免（見上方 rules 區塊說明的成因與範圍）。"
  - id: "AE1"
    message: "*references/hardening-patterns.md (partial)*"
    reason: "掃描器限制：連到本 skill 自帶的 references/hardening-patterns.md（含 #anchor）的相對連結；該檔存在於同一目錄且一併被掃描（見其 SSRF1 條目），掃描器對 skill 內本地參考檔一律標 partial，並非規避分析。"
