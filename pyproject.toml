# Tool configuration only. This repository ships Markdown Agent Skills and
# zero-dependency Node validators (scripts/*.js), not a Python package, so
# there is deliberately no [project] or [build-system] table -- the file
# exists so a bare `ruff check` or `pytest` locally behaves the way CI does.
#
# Keep these values in sync with .github/workflows/ci.yml.

[tool.ruff]
target-version = "py312"
src = ["tests", "tools"]

[tool.ruff.lint]
select = ["E9", "F"]

[tool.pytest.ini_options]
testpaths = ["tests"]
